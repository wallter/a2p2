name: Problem
description: a2p2 did something wrong or said something unclear.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        One problem per issue. Never paste message text from rooms, invite
        tokens, key files, attachments, your home directory path or user
        name, host names, public IP addresses, employer or customer names,
        or anything from your code. Replace them with HOST, USER or
        203.0.113.9. Trim `a2p2 status` and `a2p2 doctor` output first.
        Security problems do not go here: see the security policy.
  - type: input
    id: version
    attributes:
      label: Output of a2p2 version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, architecture, and harness with its version if relevant
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and its output
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What you tried
  - type: dropdown
    id: seen
    attributes:
      label: Seen or read
      options:
        - I saw it happen
        - I only read it in the documentation
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date observed
