name: ci
# Kept small on purpose (docs/RELEASING.md): the full gate is run locally
# before a release, including the Linux suite in a container
# (`make prerelease`). Here: one Linux job for pull requests that touch
# code, and on request. Nothing runs on a push to main; macOS is covered
# by local development and the release checklist. A Windows job runs only
# on request (workflow_dispatch).
on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'internal/**/testdata/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # fmt, vet, the Windows build gate, the licence check, the requirement
      # register, the recipes check, the race tests and the launcher's tests.
      - run: make check
      # staticcheck at a pinned version, downloaded by `go run`.
      - run: make lint
  # Windows, only when a person runs this workflow by hand (Actions, ci, Run
  # workflow): never on a pull request. The log prints every test only when
  # a package fails, and lists the tests skipped on Windows.
  windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the system
        run: cmd //c ver && go version && go env GOOS GOARCH TEMP && sc query afunix || true
      - run: go build ./...
      - run: go vet ./...
      - name: go test ./... (verbose output only for failing packages)
        run: |
          fail=0
          for p in $(go list ./...); do
            if go test -count=1 -timeout 20m -v "$p" > out.txt 2>&1; then
              echo "ok   $p"
            else
              fail=1
              echo "FAIL $p (full output follows)"
              cat out.txt
            fi
            grep -A1 -e '--- SKIP' out.txt | sed 's/^/    /' || true
          done
          exit $fail
