name: ci
# Kept small on purpose (docs/RELEASING.md): the full gate is run locally
# before a release, including the Linux suite in a container
# (`make prerelease`). Here: one Linux job for pull requests that touch
# code, and on request. Nothing runs on a push to main; macOS is covered
# by local development and the release checklist. A run by hand (Actions,
# ci, Run workflow) chooses what to run with `what`: linux (the default),
# windows, or all. Every action is pinned to a full commit SHA with its
# release tag in the comment (scripts/workflows.sh checks it), and no
# checkout keeps the token in .git/config.
on:
  pull_request:
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'internal/**/testdata/**'
      # The page's HTML, script and style are not Go files.
      - 'internal/web/static/**'
      - '.gitattributes'
  workflow_dispatch:
    inputs:
      what:
        description: 'Which jobs to run'
        type: choice
        options: [linux, windows, all]
        default: linux
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Pull requests, and a run by hand that asks for linux or all.
    if: github.event_name == 'pull_request' || inputs.what != 'windows'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # fmt, vet, the Windows build gate, the licence check, the requirement
      # register, the recipes check, the race tests and the launcher's tests.
      # Two cores: the slow packages run as two shards (scripts/gotest.sh).
      - run: make check SHARDS=2
      # staticcheck at a pinned version, downloaded by `go run`.
      - run: make lint
  # Windows: only a run by hand that asks for windows or all, never a pull
  # request. The log prints a package's tests only when it fails, and lists
  # the tests skipped on Windows. The deep differential schedules of
  # internal/node (minutes each, and about the delivery rules, not the
  # operating system) are left out here with -skip; they run on Linux and
  # macOS.
  windows:
    if: github.event_name == 'workflow_dispatch' && (inputs.what == 'windows' || inputs.what == 'all')
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      DEEP: 'AgreesWithTheDeliveryModelOn(EveryShortSchedule|RandomSchedules)$'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: the system
        run: cmd //c ver && go version && go env GOOS GOARCH TEMP && whoami && (sc query afunix || true)
      - name: line endings are as committed
        run: git ls-files --eol | grep -v 'w/lf\|w/-text\|w/none' || echo "every text file is LF in the working tree"
      - run: go build ./...
      - run: go vet ./...
      - name: go test ./... (verbose output only for failing packages)
        run: |
          echo "left out on Windows (-skip): $DEEP"
          fail=0
          for p in $(go list ./...); do
            if go test -count=1 -timeout 25m -skip "$DEEP" -v "$p" > out.txt 2>&1; then
              echo "ok   $p"
            else
              fail=1
              echo "FAIL $p (full output follows)"
              cat out.txt
            fi
            grep -A1 -e '--- SKIP' out.txt | sed 's/^/    /' || true
          done
          exit $fail
