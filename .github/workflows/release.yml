name: release
# Pushing a tag such as v0.3.0 builds the static binaries a2p2_<os>_<arch>
# for linux and darwin, and a2p2_windows_<arch>.exe, on amd64 and arm64 with
# `make release`, writes
# SHA256SUMS, and attaches them to a GitHub release made with the gh CLI,
# with that version's section of CHANGELOG.md as the notes. Before it
# publishes, it attests the binaries (SLSA build provenance, signed through
# Sigstore's public instance, so each release adds a public log entry naming
# this repository, the commit and this workflow). This is the only
# workflow that runs without a person asking; see docs/RELEASING.md.
#
# Two jobs. `build` checks out the tag and runs the Go toolchain with a
# read-only token. `publish` holds the write scopes, checks out nothing,
# runs no Go and no repository code: it takes the files `build` made,
# checks them against SHA256SUMS, attests them and creates the release.
# Every action is pinned to a full commit SHA, with its release tag in the
# comment (scripts/workflows.sh, run by make check, refuses a tag or a
# branch name).
#
# The tests are not run here: `make prerelease` ran check, lint, vuln, the
# Linux suite in a container and a chaos run on this commit, and `make tag`
# refuses to tag a commit without its stamp (DECISIONS, D-cycle). A tag
# pushed by hand skips that gate; the steps below still build from the tag
# with no cache and check what they publish.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The token is not left in .git/config for the steps that follow.
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # No module or build cache: a cache saved by another workflow run
          # must not be able to change what goes into a released binary.
          cache: false
      # A short sanity check of the tagged source; the full gate ran locally.
      - run: go vet ./...
      - name: the changelog has a section for this version; the notes carry the install block
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md && test -s notes.md
      - run: make release VERSION="$GITHUB_REF_NAME"
      - name: the binary reports the tag
        run: test "$(dist/a2p2_linux_amd64 version)" = "a2p2 $GITHUB_REF_NAME"
      - run: mv notes.md dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 1
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its files
      id-token: write # lets the attest step get a signing identity for this run
      attestations: write # lets the attest step store the attestation
    steps:
      # The download fails on a digest mismatch (the v8 default).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      # Exactly these files, and SHA256SUMS one to one with the binaries:
      # every line is `<sha256>  <name>` and the names are the six, each
      # once, so no binary goes out unchecked. scripts/release-test.sh runs
      # this block.
      - name: the files are the six binaries, and each matches SHA256SUMS
        working-directory: dist
        run: |
          want="SHA256SUMS
          a2p2_darwin_amd64
          a2p2_darwin_arm64
          a2p2_linux_amd64
          a2p2_linux_arm64
          a2p2_windows_amd64.exe
          a2p2_windows_arm64.exe
          notes.md"
          test "$(ls -A | LC_ALL=C sort)" = "$want"
          bins=$(printf '%s\n' "$want" | grep '^a2p2_')
          test "$(grep -Evc '^[0-9a-f]{64}  a2p2_[a-z0-9_]+(\.exe)?$' SHA256SUMS)" = 0
          test "$(sed 's/^[0-9a-f]*  //' SHA256SUMS | LC_ALL=C sort)" = "$bins"
          sha256sum --strict -c SHA256SUMS
          test -s notes.md
      # Before publish, so a release never goes out without its attestation.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/a2p2_*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/a2p2_* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "a2p2 $GITHUB_REF_NAME" \
            --notes-file dist/notes.md --verify-tag $pre
