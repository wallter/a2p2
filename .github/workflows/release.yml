name: release
# Pushing a tag such as v0.3.0 builds the static binaries a2p2_<os>_<arch>
# for linux and darwin, and a2p2_windows_<arch>.exe, on amd64 and arm64 with
# `make release`, writes
# SHA256SUMS, and attaches them to a GitHub release made with the gh CLI,
# with that version's section of CHANGELOG.md as the notes. Before it
# publishes, it attests the binaries (SLSA build provenance, signed through
# Sigstore's public instance, so each release adds a public log entry naming
# this repository, the commit and this workflow). This is the only
# workflow that runs without a person asking; see docs/RELEASING.md.
#
# The tests are not run here: `make prerelease` ran check, lint, vuln, the
# Linux suite in a container and a chaos run on this commit, and `make tag`
# refuses to tag a commit without its stamp (DECISIONS, D-cycle). A tag
# pushed by hand skips that gate; the steps below still build from the tag
# with no cache and check what they publish.
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the release and upload its files
      id-token: write # lets the attest step get a signing identity for this run
      attestations: write # lets the attest step store the attestation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # No module or build cache: a cache saved by another workflow run
          # must not be able to change what goes into a released binary.
          cache: false
      # A short sanity check of the tagged source; the full gate ran locally.
      - run: go vet ./...
      - name: the changelog has a section for this version; the notes carry the install block
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md && test -s notes.md
      - run: make release VERSION="$GITHUB_REF_NAME"
      - name: the binary reports the tag
        run: test "$(dist/a2p2_linux_amd64 version)" = "a2p2 $GITHUB_REF_NAME"
      # Before publish, so a release never goes out without its attestation.
      - uses: actions/attest@v4
        with:
          subject-path: dist/a2p2_*
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/a2p2_* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "a2p2 $GITHUB_REF_NAME" \
            --notes-file notes.md --verify-tag $pre
