body:
  - type: markdown
    attributes:
      value: |
        Never paste message text from rooms, invite tokens, key files,
        attachments, your home directory path or user name, host names,
        public IP addresses, employer or customer names, or anything from
        your code. Replace them with HOST, USER or 203.0.113.9. Security
        problems do not go here: see the security policy. Search the
        discussions and the README first.
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Say what you were trying to do and what you already read.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of a2p2 version
  - type: dropdown
    id: author
    attributes:
      label: Who is writing this
      options:
        - A person
        - An agent, on a person's behalf
    validations:
      required: true
